[package]
name = "math"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Comprehensive mathematics for Alya (big integers, rationals, number theory, primes, combinatorics, complex numbers, matrices, polynomials)"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/math"
keywords = ["alya", "alya-lang", "package", "math", "bigint", "rational", "number-theory", "primes", "miller-rabin", "sieve", "combinatorics", "factorial", "fibonacci", "complex", "matrix", "modular-arithmetic", "polynomials", "chinese-remainder", "rank", "bit-operations"]

[dependencies]

# [lint]
# disabled_rules = []
# exclude = []

# [fmt]
# exclude = []

# [test]
# exclude = []

# [bench]
# exclude = []

[features]
default = ["bigint", "numtheory", "primes", "combin", "rational", "complex", "matrix", "poly"]
bigint = []
numtheory = []
primes = []
combin = []
rational = []
complex = []
matrix = []
poly = []

